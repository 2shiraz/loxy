openapi: 3.0.3
info:
  title: Loxy API
  version: 1.0.0
  description: 'REST API of Loxy, a self-hosted management panel for HAProxy 3.4.

    Objects map directly to HAProxy: frontends (listeners + routing rules), backends (server pools + health checks),

    servers, certificates. Session cookie or `Authorization: Bearer loxy_<prefix>_<secret>`. Mutating requests with a

    session cookie must send `X-LOXY-CSRF`.

    '
servers:
- url: /api/v1
security:
- session: []
- bearer: []
tags:
- name: auth
- name: frontends
- name: backends
- name: certificates
- name: domains
- name: inventory
- name: system
paths:
  /healthz:
    get:
      operationId: healthz
      tags:
      - system
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      operationId: readyz
      tags:
      - system
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      operationId: me
      tags:
      - auth
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Error'
  /auth/password:
    post:
      operationId: changePassword
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Changed
        '422':
          $ref: '#/components/responses/Error'
  /auth/totp/setup:
    post:
      operationId: totpSetup
      tags:
      - auth
      responses:
        '200':
          description: New secret (not active until confirmed)
          content:
            application/json:
              schema:
                type: object
                required:
                - secret
                - otpauth_url
                properties:
                  secret:
                    type: string
                  otpauth_url:
                    type: string
  /auth/totp/enable:
    post:
      operationId: totpEnable
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
      responses:
        '204':
          description: 2FA enabled
        '422':
          $ref: '#/components/responses/Error'
  /auth/totp/disable:
    post:
      operationId: totpDisable
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
      responses:
        '204':
          description: 2FA disabled
        '422':
          $ref: '#/components/responses/Error'
  /certificates:
    get:
      operationId: listCertificates
      tags:
      - certificates
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                required:
                - certificates
                properties:
                  certificates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'
    post:
      operationId: createCertificate
      tags:
      - certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '422':
          $ref: '#/components/responses/Error'
  /certificates/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getCertificate
      tags:
      - certificates
      responses:
        '200':
          description: Cert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
    patch:
      operationId: updateCertificate
      tags:
      - certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                labels:
                  $ref: '#/components/schemas/Labels'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
    delete:
      operationId: deleteCertificate
      tags:
      - certificates
      responses:
        '204':
          description: Deleted
        '409':
          $ref: '#/components/responses/Error'
  /certificates/{id}/actions/renew:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: renewCertificate
      tags:
      - certificates
      responses:
        '202':
          description: Renewal started
  /domains:
    get:
      operationId: listDomains
      tags:
      - domains
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                required:
                - domains
                properties:
                  domains:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
    post:
      operationId: createDomain
      tags:
      - domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '422':
          $ref: '#/components/responses/Error'
  /domains/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getDomain
      tags:
      - domains
      responses:
        '200':
          description: Domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
    patch:
      operationId: updateDomain
      tags:
      - domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
    delete:
      operationId: deleteDomain
      tags:
      - domains
      responses:
        '204':
          description: Deleted
  /domains/{id}/actions/verify:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: verifyDomain
      tags:
      - domains
      responses:
        '200':
          description: Verified now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
  /domains/{id}/actions/issue_certificate:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: issueDomainCertificate
      tags:
      - domains
      responses:
        '202':
          description: Issuance started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '422':
          $ref: '#/components/responses/Error'
  /dns_providers:
    get:
      operationId: listDNSProviders
      tags:
      - domains
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                required:
                - dns_providers
                - kinds
                properties:
                  dns_providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/DNSProvider'
                  kinds:
                    type: array
                    items:
                      $ref: '#/components/schemas/DNSProviderKind'
    post:
      operationId: createDNSProvider
      tags:
      - domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSProviderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - dns_provider
                properties:
                  dns_provider:
                    $ref: '#/components/schemas/DNSProvider'
        '422':
          $ref: '#/components/responses/Error'
  /dns_providers/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    delete:
      operationId: deleteDNSProvider
      tags:
      - domains
      responses:
        '204':
          description: Deleted
        '409':
          $ref: '#/components/responses/Error'
  /dns_providers/{id}/zones:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: listDNSZones
      tags:
      - domains
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                type: object
                required:
                - zones
                properties:
                  zones:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
  /dns_providers/{id}/zones/{zone}/records:
    parameters:
    - $ref: '#/components/parameters/Id'
    - name: zone
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listDNSRecords
      tags:
      - domains
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                type: object
                required:
                - records
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/DNSRecord'
    post:
      operationId: createDNSRecord
      tags:
      - domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSRecord'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - record
                properties:
                  record:
                    $ref: '#/components/schemas/DNSRecord'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteDNSRecord
      tags:
      - domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSRecord'
      responses:
        '204':
          description: Deleted
  /nodes:
    get:
      operationId: listNodes
      tags:
      - system
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: object
                required:
                - nodes
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
  /nodes/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateNode
      tags:
      - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - node
                properties:
                  node:
                    $ref: '#/components/schemas/Node'
  /nodes/{id}/ips:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: addNodeIP
      tags:
      - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address
              properties:
                address:
                  type: string
                label:
                  type: string
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                required:
                - node
                properties:
                  node:
                    $ref: '#/components/schemas/Node'
        '422':
          $ref: '#/components/responses/Error'
  /nodes/{id}/ips/{ipid}:
    parameters:
    - $ref: '#/components/parameters/Id'
    - name: ipid
      in: path
      required: true
      schema:
        type: integer
        format: int64
    delete:
      operationId: deleteNodeIP
      tags:
      - system
      responses:
        '204':
          description: Deleted
        '409':
          $ref: '#/components/responses/Error'
  /nodes/{id}/revisions:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: listRevisions
      tags:
      - system
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                required:
                - revisions
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Revision'
  /nodes/{id}/revisions/{rev}/diff:
    parameters:
    - $ref: '#/components/parameters/Id'
    - name: rev
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      operationId: diffRevision
      tags:
      - system
      parameters:
      - name: against
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Unified diff
          content:
            text/plain:
              schema:
                type: string
  /nodes/{id}/revisions/{rev}/actions/rollback:
    parameters:
    - $ref: '#/components/parameters/Id'
    - name: rev
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      operationId: rollbackRevision
      tags:
      - system
      responses:
        '202':
          description: Rollback applied
        '422':
          $ref: '#/components/responses/Error'
  /events:
    get:
      operationId: streamEvents
      tags:
      - system
      responses:
        '200':
          description: SSE stream of Event objects (event name = kind)
          content:
            text/event-stream:
              schema:
                type: string
  /events/history:
    get:
      operationId: listEvents
      tags:
      - system
      parameters:
      - name: frontend_id
        in: query
        schema: &id001
          type: integer
          format: int64
      - name: backend_id
        in: query
        schema: *id001
      - name: kind
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                required:
                - events
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
  /audit:
    get:
      operationId: listAudit
      tags:
      - system
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Audit
          content:
            application/json:
              schema:
                type: object
                required:
                - audit
                properties:
                  audit:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
  /users:
    get:
      operationId: listUsers
      tags:
      - system
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      operationId: createUser
      tags:
      - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/Error'
  /users/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    delete:
      operationId: deleteUser
      tags:
      - system
      responses:
        '204':
          description: Deleted
  /api_tokens:
    get:
      operationId: listAPITokens
      tags:
      - system
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                required:
                - api_tokens
                properties:
                  api_tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIToken'
    post:
      operationId: createAPIToken
      tags:
      - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenCreate'
      responses:
        '201':
          description: Created; `token` is shown once
          content:
            application/json:
              schema:
                type: object
                required:
                - api_token
                - token
                properties:
                  api_token:
                    $ref: '#/components/schemas/APIToken'
                  token:
                    type: string
        '422':
          $ref: '#/components/responses/Error'
  /api_tokens/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    delete:
      operationId: deleteAPIToken
      tags:
      - system
      responses:
        '204':
          description: Revoked
  /notification_channels:
    get:
      operationId: listChannels
      tags:
      - system
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: object
                required:
                - notification_channels
                - kinds
                properties:
                  notification_channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationChannel'
                  kinds:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required:
                        - name
                        - label
                        - secret
                        properties:
                          name:
                            type: string
                          label:
                            type: string
                          secret:
                            type: boolean
    post:
      operationId: createChannel
      tags:
      - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannelInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - notification_channel
                properties:
                  notification_channel:
                    $ref: '#/components/schemas/NotificationChannel'
        '422':
          $ref: '#/components/responses/Error'
  /notification_channels/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    delete:
      operationId: deleteChannel
      tags:
      - system
      responses:
        '204':
          description: Deleted
  /notification_channels/{id}/actions/test:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: testChannel
      tags:
      - system
      responses:
        '204':
          description: Test message delivered
        '502':
          $ref: '#/components/responses/Error'
  /alert_rules:
    get:
      operationId: listAlertRules
      tags:
      - system
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required:
                - alert_rules
                properties:
                  alert_rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertRule'
    post:
      operationId: createAlertRule
      tags:
      - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - alert_rule
                properties:
                  alert_rule:
                    $ref: '#/components/schemas/AlertRule'
        '422':
          $ref: '#/components/responses/Error'
  /alert_rules/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    delete:
      operationId: deleteAlertRule
      tags:
      - system
      responses:
        '204':
          description: Deleted
  /frontends:
    get:
      operationId: listFrontends
      tags:
      - frontends
      parameters:
      - name: label_selector
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                required:
                - frontends
                properties:
                  frontends:
                    type: array
                    items:
                      $ref: '#/components/schemas/Frontend'
    post:
      operationId: createFrontend
      tags:
      - frontends
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontendInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - frontend
                properties:
                  frontend:
                    $ref: '#/components/schemas/Frontend'
        '422': &id002
          $ref: '#/components/responses/Error'
  /frontends/{id}:
    parameters:
    - &id003
      $ref: '#/components/parameters/Id'
    get:
      operationId: getFrontend
      tags:
      - frontends
      responses:
        '200':
          description: Frontend
          content:
            application/json:
              schema:
                type: object
                required:
                - frontend
                properties:
                  frontend:
                    $ref: '#/components/schemas/Frontend'
        '404': *id002
    put:
      operationId: updateFrontend
      tags:
      - frontends
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontendInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - frontend
                properties:
                  frontend:
                    $ref: '#/components/schemas/Frontend'
        '409': *id002
        '422': *id002
    patch:
      operationId: patchFrontend
      tags:
      - frontends
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontendPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - frontend
                properties:
                  frontend:
                    $ref: '#/components/schemas/Frontend'
        '422': *id002
    delete:
      operationId: deleteFrontend
      tags:
      - frontends
      responses:
        '204':
          description: Deleted
        '423': *id002
  /frontends/{id}/config:
    parameters:
    - *id003
    get:
      operationId: getFrontendConfig
      tags:
      - frontends
      responses:
        '200':
          description: Rendered HAProxy sections of this frontend (and the backends it uses)
          content:
            text/plain:
              schema:
                type: string
  /frontends/{id}/metrics:
    parameters:
    - *id003
    get:
      operationId: getFrontendMetrics
      tags:
      - frontends
      parameters: &id004
      - name: type
        in: query
        schema:
          type: string
        description: comma separated series names
      - name: start
        in: query
        schema: *id001
      - name: end
        in: query
        schema: *id001
      - name: step
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Columnar series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /frontends/{id}/metrics/stream:
    parameters:
    - *id003
    get:
      operationId: streamFrontendMetrics
      tags:
      - frontends
      responses:
        '200':
