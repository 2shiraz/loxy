              $ref: '#/components/schemas/ServiceInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - service
                properties:
                  service:
                    $ref: '#/components/schemas/Service'
        '422': *id003
    delete:
      operationId: deleteService
      tags:
