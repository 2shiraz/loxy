components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-loxy_session
    bearer:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Status:
      type: object
      required:
      - status
      properties:
        status:
          type: string
        version:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - invalid_input
              - conflict
              - not_found
              - forbidden
              - unauthorized
              - rate_limited
              - apply_failed
              - internal
              - totp_required
            message:
              type: string
            details:
              type: object
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required:
                    - name
                    - messages
                    properties:
                      name:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
    Labels:
      type: object
      additionalProperties:
        type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
        totp:
          type: string
          description: 6-digit code, required when 2FA is enabled (401 with code totp_required otherwise)
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
    User:
      type: object
      required:
      - id
      - email
      - role
      - created_at
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - operator
          - viewer
        created_at:
          type: integer
          format: int64
        last_login_at:
          type: integer
          format: int64
          nullable: true
        totp_enabled:
          type: boolean
    UserCreate:
      type: object
      required:
      - email
      - password
      - role
      properties:
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum:
          - admin
          - operator
          - viewer
    SessionResponse:
      type: object
      required:
      - user
      - csrf_token
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
    HealthSummary:
      type: object
      required:
      - status
      - healthy
      - total
      - messages
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
          - unknown
        healthy:
          type: integer
        total:
          type: integer
        messages:
          type: array
          items:
            type: string
    HealthCheck:
      type: object
      properties:
        protocol:
          type: string
          enum:
          - tcp
          - http
          - https
        port:
          type: integer
        interval_s:
          type: integer
        timeout_s:
          type: integer
        retries:
          type: integer
        http:
          type: object
          nullable: true
          properties:
            domain:
              type: string
              nullable: true
            path:
              type: string
            response:
              type: string
              nullable: true
            status_codes:
              type: array
              items:
                type: string
            tls_verify:
              type: boolean
    Certificate:
      type: object
      required:
      - id
      - name
      - type
      - domains
      - status
      - used_by
      - labels
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum:
          - uploaded
          - managed
        domains:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - pending
          - issued
          - renewing
          - failed
        challenge:
          type: string
          enum:
          - http01
          - dns01
          nullable: true
        dns_provider_id:
          type: integer
          format: int64
          nullable: true
        key_type:
          type: string
        issuer:
          type: string
          nullable: true
        serial:
          type: string
          nullable: true
        fingerprint_sha256:
          type: string
          nullable: true
        not_before:
          type: integer
          format: int64
          nullable: true
        not_after:
          type: integer
          format: int64
          nullable: true
        last_error:
          type: string
          nullable: true
        used_by:
          type: array
          items:
            type: integer
            format: int64
          description: service ids
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          type: integer
          format: int64
    CertificateCreate:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - uploaded
          - managed
        certificate:
          type: string
          description: PEM leaf (uploaded)
        chain:
          type: string
        private_key:
          type: string
        domains:
          type: array
          items:
            type: string
        challenge:
          type: string
          enum:
          - http01
          - dns01
        dns_provider_id:
          type: integer
          format: int64
        key_type:
          type: string
          enum:
          - ecdsa256
          - rsa2048
          - rsa4096
        labels:
          $ref: '#/components/schemas/Labels'
    CertificateResponse:
      type: object
      required:
      - certificate
      properties:
        certificate:
          $ref: '#/components/schemas/Certificate'
    DNSRequiredRecord:
      type: object
      required:
      - type
      - name
      - value
      - ttl
      properties:
        type:
          type: string
        name:
          type: string
        value:
          type: string
        ttl:
          type: integer
    Domain:
      type: object
      required:
      - id
      - fqdn
      - status
      - auto_records
      - required_records
      - observed
      - created_at
      properties:
        id:
          type: integer
          format: int64
        fqdn:
          type: string
        dns_provider_id:
          type: integer
          format: int64
          nullable: true
        zone:
          type: string
          nullable: true
        auto_records:
          type: boolean
        status:
          type: string
          enum:
          - unknown
          - ok
          - wrong_ip
          - missing
          - error
        status_detail:
          type: string
          nullable: true
        required_records:
          type: array
          items:
            $ref: '#/components/schemas/DNSRequiredRecord'
        observed:
          type: object
          required:
          - a
          - aaaa
          properties:
            a:
              type: array
              items:
                type: string
            aaaa:
              type: array
              items:
                type: string
        checked_at:
          type: integer
          format: int64
          nullable: true
        certificate_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: integer
          format: int64
        frontend_id: &id005
          type: integer
          format: int64
          nullable: true
    DomainInput:
      type: object
      properties:
        fqdn:
          type: string
        dns_provider_id:
          type: integer
          format: int64
          nullable: true
        auto_records:
          type: boolean
        frontend_id: *id005
    DomainResponse:
      type: object
      required:
      - domain
      properties:
        domain:
          $ref: '#/components/schemas/Domain'
    DNSProviderKind:
      type: object
      required:
      - kind
      - label
      - fields
      properties:
        kind:
          type: string
        label:
          type: string
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - label
            - secret
            properties:
              name:
                type: string
              label:
                type: string
              secret:
                type: boolean
              help:
                type: string
    DNSProvider:
      type: object
      required:
      - id
      - name
      - kind
      - status
      - configured
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
        status:
          type: string
          enum:
          - ok
          - error
          - unknown
        last_error:
          type: string
          nullable: true
        configured:
          type: boolean
        created_at:
          type: integer
          format: int64
    DNSProviderInput:
      type: object
      required:
      - name
      - kind
      - credentials
      properties:
        name:
          type: string
        kind:
          type: string
        credentials:
          type: object
          additionalProperties:
            type: string
    DNSRecord:
      type: object
      required:
      - type
      - name
      - value
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - A
          - AAAA
          - CNAME
          - TXT
          - MX
          - CAA
          - SRV
          - NS
        name:
          type: string
          description: relative to the zone, @ for apex
        value:
          type: string
          description: RDATA in zone-file presentation format
        ttl:
          type: integer
        managed:
          type: boolean
    NodeIP:
      type: object
      required:
      - id
      - address
      - family
      properties:
        id: *id001
        address:
          type: string
        family:
          type: integer
        label:
          type: string
    Node:
      type: object
      required:
      - id
      - name
      - status
      - ips
      - desired_version
      - applied_version
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
        haproxy_version:
          type: string
        haproxy_running_version:
          type: string
        loxy_version:
          type: string
        features:
          type: array
          items:
            type: string
        uptime_s:
          type: integer
          format: int64
        reloads:
          type: integer
        ips:
          type: array
          items:
            $ref: '#/components/schemas/NodeIP'
        desired_version:
          type: integer
          format: int64
        applied_version:
          type: integer
          format: int64
    NodeUpdate:
      type: object
      properties:
        name:
          type: string
    Revision:
      type: object
      required:
      - id
      - revision
      - kind
      - result
      - duration_ms
      - sha256
      - created_at
      - pinned
      properties:
        id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        desired_version:
          type: integer
          format: int64
        kind:
          type: string
          enum:
          - runtime
          - reload
          - rollback
          - bootstrap
        result:
          type: string
          enum:
          - ok
          - failed
        duration_ms:
          type: integer
        sha256:
          type: string
        haproxy_output:
          type: string
        created_at:
          type: integer
          format: int64
        pinned:
          type: boolean
    Metrics:
      type: object
      required:
      - start
      - end
      - step
      - timestamps
      - series
      properties:
        start:
          type: integer
          format: int64
        end:
          type: integer
          format: int64
        step:
          type: integer
        timestamps:
          type: array
          items:
            type: integer
            format: int64
        series:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
              nullable: true
    MetricsPoint:
      type: object
      required:
      - ts
      properties:
        ts:
          type: integer
          format: int64
        open_connections:
          type: number
        connections_per_second:
          type: number
        requests_per_second:
          type: number
        bandwidth.in:
          type: number
        bandwidth.out:
          type: number
    Event:
      type: object
      required:
      - id
      - ts
      - kind
      - severity
      - message
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: integer
          format: int64
        kind:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - error
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        frontend_id: *id005
        backend_id: *id005
    AuditEntry:
      type: object
      required:
      - id
      - ts
      - action
      - resource_type
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: integer
          format: int64
        actor:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: integer
          format: int64
          nullable: true
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
    APIToken:
      type: object
      required:
      - id
      - name
      - prefix
      - role
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          type: string
        role:
          type: string
          enum:
          - admin
          - operator
          - viewer
        expires_at:
          type: integer
          format: int64
          nullable: true
        last_used_at:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: integer
          format: int64
    APITokenCreate:
      type: object
      required:
      - name
      - role
      properties:
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - operator
          - viewer
        expires_in_days:
          type: integer
    NotificationChannel:
      type: object
      required:
      - id
      - name
      - kind
      - enabled
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum:
          - webhook
          - email
          - telegram
          - slack
        enabled:
          type: boolean
        created_at:
          type: integer
          format: int64
    NotificationChannelInput:
      type: object
      required:
      - name
      - kind
      - config
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - webhook
          - email
          - telegram
          - slack
        config:
          type: object
          additionalProperties:
            type: string
    AlertRule:
      type: object
      required:
      - id
      - event_kinds
      - label_filter
      - channel_id
      - min_severity
      - cooldown_s
      properties:
        id:
          type: integer
          format: int64
        event_kinds:
          type: array
          items:
            type: string
        channel_id:
          type: integer
          format: int64
        min_severity:
          type: string
          enum:
          - info
          - warning
          - error
        cooldown_s:
          type: integer
        label_filter:
          type: string
          description: label selector on frontend/backend labels
    AlertRuleInput:
      type: object
      required:
      - channel_id
      properties:
        event_kinds:
          type: array
          items:
            type: string
          description: e.g. server.health.changed, apply.*; empty = all
        channel_id:
          type: integer
          format: int64
        min_severity:
          type: string
          enum:
          - info
          - warning
          - error
        cooldown_s:
          type: integer
        label_filter:
          type: string
          description: label selector on frontend/backend labels
    Bind:
      type: object
      required:
      - address
      - port
      properties:
        address:
          type: string
          description: IP address, or "*" for all interfaces
        port:
          type: integer
    Route:
      type: object
      required:
      - backend_id
      properties:
        id: *id001
        hosts:
          type: array
          items:
            type: string
          description: Host header match; "*.example.com" matches subdomains
        path_prefix:
          type: string
          description: e.g. /api; empty = any path
        backend_id: *id001
    FrontendInput:
      type: object
      required:
      - name
      - mode
      - binds
      properties:
        name:
          type: string
        description:
          type: string
        mode:
          type: string
