        '404': *id003
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-loxy_session
    bearer:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Status:
      type: object
      required:
      - status
      properties:
        status:
          type: string
        version:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - invalid_input
              - conflict
              - not_found
              - forbidden
              - unauthorized
              - rate_limited
              - apply_failed
              - internal
              - totp_required
            message:
              type: string
            details:
              type: object
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required:
                    - name
                    - messages
                    properties:
                      name:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
    Labels:
      type: object
      additionalProperties:
        type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
        totp:
          type: string
          description: 6-digit code, required when 2FA is enabled (401 with code totp_required otherwise)
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
    User:
      type: object
      required:
      - id
      - email
      - role
      - created_at
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - operator
          - viewer
        created_at:
          type: integer
          format: int64
        last_login_at:
          type: integer
          format: int64
          nullable: true
        totp_enabled:
          type: boolean
    UserCreate:
      type: object
      required:
      - email
      - password
      - role
      properties:
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum:
          - admin
          - operator
          - viewer
    SessionResponse:
      type: object
      required:
      - user
      - csrf_token
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
    HealthSummary:
      type: object
      required:
      - status
      - healthy
      - total
      - messages
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
          - unknown
        healthy:
          type: integer
        total:
          type: integer
        messages:
          type: array
          items:
            type: string
    HealthCheck:
      type: object
      properties:
        protocol:
          type: string
          enum:
          - tcp
          - http
          - https
        port:
          type: integer
          nullable: true
          description: check port; null = each server's own port
        interval_s:
          type: integer
        timeout_s:
          type: integer
        retries:
          type: integer
        http:
          type: object
          nullable: true
          properties:
            domain:
              type: string
              nullable: true
            path:
              type: string
            response:
              type: string
              nullable: true
            status_codes:
              type: array
              items:
                type: string
            tls_verify:
              type: boolean
    Certificate:
      type: object
      required:
      - id
      - name
      - type
      - domains
      - status
      - used_by
      - labels
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum:
          - uploaded
          - managed
        domains:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - pending
          - issued
          - renewing
          - failed
        challenge:
          type: string
          enum:
          - http01
          - dns01
          nullable: true
        dns_provider_id:
          type: integer
          format: int64
          nullable: true
        key_type:
          type: string
        issuer:
          type: string
          nullable: true
        serial:
          type: string
          nullable: true
        fingerprint_sha256:
          type: string
          nullable: true
        not_before:
          type: integer
          format: int64
          nullable: true
        not_after:
          type: integer
          format: int64
          nullable: true
        last_error:
          type: string
          nullable: true
        used_by:
          type: array
          items:
            type: integer
            format: int64
          description: service ids
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          type: integer
          format: int64
    CertificateCreate:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - uploaded
          - managed
        certificate:
          type: string
          description: PEM leaf (uploaded)
        chain:
          type: string
        private_key:
          type: string
        domains:
          type: array
          items:
            type: string
        challenge:
          type: string
          enum:
          - http01
          - dns01
        dns_provider_id:
          type: integer
          format: int64
        key_type:
          type: string
          enum:
          - ecdsa256
          - rsa2048
          - rsa4096
        labels:
          $ref: '#/components/schemas/Labels'
    CertificateResponse:
      type: object
      required:
      - certificate
      properties:
        certificate:
          $ref: '#/components/schemas/Certificate'
    DNSRequiredRecord:
      type: object
      required:
      - type
      - name
      - value
      - ttl
      properties:
        type:
          type: string
        name:
          type: string
        value:
          type: string
        ttl:
          type: integer
    Domain:
      type: object
      required:
      - id
      - fqdn
      - status
      - auto_records
      - required_records
      - observed
      - created_at
      - https
      properties:
        id:
          type: integer
          format: int64
        fqdn:
          type: string
        dns_provider_id:
          type: integer
          format: int64
          nullable: true
        zone:
          type: string
          nullable: true
        auto_records:
          type: boolean
        status:
          type: string
          enum:
          - unknown
          - ok
          - wrong_ip
          - missing
          - error
        status_detail:
          type: string
          nullable: true
        required_records:
          type: array
          items:
            $ref: '#/components/schemas/DNSRequiredRecord'
        observed:
          type: object
          required:
          - a
          - aaaa
          properties:
            a:
              type: array
              items:
                type: string
            aaaa:
              type: array
              items:
                type: string
        checked_at:
          type: integer
          format: int64
          nullable: true
        certificate_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: integer
          format: int64
        project_id: &id005
          type: integer
          format: int64
          nullable: true
        service_id:
          type: integer
          format: int64
          nullable: true
          description: 'service the domain routes to (default: the project''s first http/https service)'
        https:
          type: boolean
          description: serve on :443 with an automatic certificate and redirect :80 to it (default true)
        url:
          type: string
          description: https://fqdn once the certificate is issued, else http://fqdn
    DomainInput:
      type: object
      properties:
        fqdn:
          type: string
        dns_provider_id:
          type: integer
          format: int64
          nullable: true
        auto_records:
          type: boolean
        project_id: *id001
        service_id:
          type: integer
          format: int64
          description: 'default: the project''s first http/https service'
        https:
          type: boolean
          description: serve on :443 with an automatic certificate and redirect :80 to it (default true)
    DomainResponse:
      type: object
      required:
      - domain
      properties:
        domain:
          $ref: '#/components/schemas/Domain'
    DNSProviderKind:
      type: object
      required:
      - kind
      - label
      - fields
      properties:
        kind:
          type: string
        label:
          type: string
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - label
            - secret
            properties:
              name:
                type: string
              label:
                type: string
              secret:
                type: boolean
              help:
                type: string
    DNSProvider:
      type: object
      required:
      - id
      - name
      - kind
      - status
      - configured
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
        status:
          type: string
          enum:
          - ok
          - error
          - unknown
        last_error:
          type: string
          nullable: true
        configured:
          type: boolean
        created_at:
          type: integer
          format: int64
    DNSProviderInput:
      type: object
      required:
      - name
      - kind
      - credentials
      properties:
        name:
          type: string
        kind:
          type: string
        credentials:
          type: object
          additionalProperties:
            type: string
    DNSRecord:
      type: object
      required:
      - type
      - name
      - value
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - A
          - AAAA
          - CNAME
          - TXT
          - MX
          - CAA
          - SRV
          - NS
        name:
          type: string
          description: relative to the zone, @ for apex
        value:
          type: string
          description: RDATA in zone-file presentation format
        ttl:
          type: integer
        managed:
          type: boolean
    NodeIP:
      type: object
      required:
      - id
      - address
      - family
      properties:
        id: &id007
          type: integer
          format: int64
        address:
          type: string
        family:
          type: integer
        label:
          type: string
    Node:
      type: object
      required:
      - id
      - name
      - status
      - ips
      - desired_version
      - applied_version
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
        haproxy_version:
          type: string
        haproxy_running_version:
          type: string
        loxy_version:
          type: string
        features:
          type: array
          items:
            type: string
        uptime_s:
          type: integer
          format: int64
        reloads:
          type: integer
        ips:
          type: array
          items:
            $ref: '#/components/schemas/NodeIP'
        desired_version:
          type: integer
          format: int64
        applied_version:
          type: integer
          format: int64
    NodeUpdate:
      type: object
      properties:
        name:
          type: string
    Revision:
      type: object
      required:
      - id
      - revision
      - kind
      - result
      - duration_ms
      - sha256
      - created_at
      - pinned
      properties:
        id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        desired_version:
          type: integer
          format: int64
        kind:
          type: string
          enum:
          - runtime
          - reload
          - rollback
          - bootstrap
        result:
          type: string
          enum:
          - ok
          - failed
        duration_ms:
          type: integer
        sha256:
          type: string
        haproxy_output:
          type: string
        created_at:
          type: integer
          format: int64
        pinned:
          type: boolean
    Metrics:
      type: object
      required:
      - start
      - end
      - step
      - timestamps
      - series
      properties:
        start:
          type: integer
          format: int64
        end:
          type: integer
          format: int64
        step:
          type: integer
        timestamps:
          type: array
          items:
            type: integer
            format: int64
        series:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
              nullable: true
    MetricsPoint:
      type: object
      required:
      - ts
      properties:
        ts:
          type: integer
          format: int64
        open_connections:
          type: number
        connections_per_second:
          type: number
        requests_per_second:
          type: number
        bandwidth.in:
          type: number
        bandwidth.out:
          type: number
    Event:
      type: object
      required:
      - id
      - ts
      - kind
      - severity
      - message
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: integer
          format: int64
        kind:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - error
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        project_id: *id005
    AuditEntry:
      type: object
      required:
      - id
      - ts
      - action
      - resource_type
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: integer
          format: int64
        actor:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: integer
          format: int64
          nullable: true
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
    APIToken:
      type: object
      required:
      - id
      - name
      - prefix
      - role
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          type: string
        role:
          type: string
          enum:
          - admin
          - operator
          - viewer
        expires_at:
          type: integer
          format: int64
          nullable: true
        last_used_at:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: integer
          format: int64
    APITokenCreate:
      type: object
      required:
      - name
      - role
      properties:
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - operator
          - viewer
        expires_in_days:
          type: integer
    NotificationChannel:
      type: object
      required:
      - id
      - name
      - kind
      - enabled
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum:
          - webhook
          - email
          - telegram
          - slack
        enabled:
          type: boolean
        created_at:
          type: integer
          format: int64
    NotificationChannelInput:
      type: object
      required:
      - name
      - kind
      - config
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - webhook
          - email
          - telegram
          - slack
        config:
          type: object
          additionalProperties:
            type: string
    AlertRule:
      type: object
      required:
      - id
      - event_kinds
      - label_filter
      - channel_id
      - min_severity
      - cooldown_s
      properties:
        id:
          type: integer
          format: int64
        event_kinds:
          type: array
          items:
            type: string
        channel_id:
          type: integer
          format: int64
        min_severity:
          type: string
          enum:
          - info
          - warning
          - error
        cooldown_s:
          type: integer
        label_filter:
          type: string
          description: label selector on project labels; node-wide events (apply, backup) are not filtered by it
    AlertRuleInput:
      type: object
      required:
      - channel_id
      properties:
        event_kinds:
          type: array
          items:
            type: string
          description: e.g. server.health.changed, apply.*; empty = all
        channel_id:
          type: integer
          format: int64
        min_severity:
          type: string
          enum:
          - info
          - warning
          - error
        cooldown_s:
          type: integer
        label_filter:
          type: string
          description: label selector on project labels; node-wide events (apply, backup) are not filtered by it
    HostInput:
      type: object
      properties:
        name:
          type: string
        ipv4: &id006
          type: string
          nullable: true
        ipv6: *id006
        private_ipv4: *id006
        labels:
          $ref: '#/components/schemas/Labels'
        notes:
          type: string
    Host:
      type: object
      required:
      - id
      - name
      - labels
      properties:
        id: *id007
        name:
          type: string
        ipv4: *id006
        ipv6: *id006
        private_ipv4: *id006
        labels:
          $ref: '#/components/schemas/Labels'
        notes:
          type: string
        used_by:
          type: array
          items: *id007
          description: project ids
    Overview:
      type: object
      required:
      - projects
      - targets
      - certificates
      - node
      properties:
        projects:
          type: object
          required:
          - total
          - apply_errors
          - healthy
          - degraded
          - unhealthy
          properties:
            total:
              type: integer
            apply_errors:
              type: integer
            healthy:
              type: integer
            degraded:
              type: integer
            unhealthy:
              type: integer
        targets:
          type: object
          required:
          - total
          - healthy
          properties:
            total:
              type: integer
            healthy:
              type: integer
        certificates:
          type: object
          required:
          - total
          - expiring_soon
          - failed
          properties:
            total:
              type: integer
            expiring_soon:
              type: integer
            failed:
              type: integer
        node:
          $ref: '#/components/schemas/Node'
        traffic:
          type: object
          required:
          - open_connections
          - requests_per_second
          - bytes_in_per_second
          - bytes_out_per_second
          properties:
            open_connections:
              type: number
            requests_per_second:
              type: number
            bytes_in_per_second:
              type: number
            bytes_out_per_second:
              type: number
    Endpoint:
      type: object
      required:
      - kind
      - url
      properties:
        kind:
          type: string
          enum:
          - port
          - domain
        url:
          type: string
        service_id: *id005
        domain_id: *id005
    Project:
      type: object
      required:
      - id
      - name
      - version
      - description
      - algorithm
      - labels
      - maintenance
      - status
      - created_at
      - endpoints
      - counts
      - health
      - stats
      properties:
        id: *id001
        name:
          type: string
        version: *id001
        description:
          type: string
        algorithm:
          type: string
          enum:
          - roundrobin
          - leastconn
          - source
          - random
        labels:
          $ref: '#/components/schemas/Labels'
        maintenance:
          type: boolean
        status:
          type: string
          enum:
          - applying
          - ready
          - error
        last_error: &id009
          type: string
          nullable: true
        created_at: *id001
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
          description: 'where the project is reachable: its ports and https/http domains'
        counts:
          type: object
          required:
          - targets
          - services
          - domains
          properties:
            targets:
              type: integer
            services:
              type: integer
            domains:
              type: integer
        health:
          $ref: '#/components/schemas/HealthSummary'
        stats:
          type: object
          required:
          - open_connections
          - requests_per_second
          - bytes_out_per_second
          properties:
            open_connections:
              type: number
            requests_per_second:
              type: number
            bytes_out_per_second:
              type: number
    ProjectCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
        algorithm:
          type: string
          enum:
          - roundrobin
          - leastconn
          - source
          - random
        labels:
          $ref: '#/components/schemas/Labels'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetInput'
          description: initial targets (optional)
        service:
          allOf:
          - $ref: '#/components/schemas/ServiceInput'
          description: first service; default http, own free port (listen_port omitted = auto), destination port 80
    ProjectUpdate:
      type: object
      required: []
      properties:
        name:
          type: string
        description:
          type: string
        algorithm:
          type: string
          enum:
          - roundrobin
          - leastconn
          - source
          - random
        labels:
          $ref: '#/components/schemas/Labels'
        maintenance:
          type: boolean
    ServiceInput:
      type: object
      required:
      - protocol
      - destination_port
      properties:
        protocol:
          type: string
          enum:
          - http
          - https
          - tcp
        listen_port:
          type: integer
          description: omit for a free port picked automatically (20000+); 80/443 are reserved for domains
        destination_port:
          type: integer
        proxy_protocol:
          type: string
          enum:
          - none
          - v1
          - v2
        timeout_s:
          type: integer
          description: client/server timeout (default 60)
        certificates:
          type: array
          items: *id001
          description: https only
        sticky_sessions:
          type: boolean
        cookie_name:
          type: string
        cookie_lifetime_s:
          type: integer
        health_check: &id008
          $ref: '#/components/schemas/HealthCheck'
    Service:
      type: object
      required:
      - id
      - project_id
      - protocol
      - listen_port
      - destination_port
      - proxy_protocol
      - timeout_s
      - certificates
      - sticky_sessions
      - cookie_name
      - cookie_lifetime_s
      - health_check
      - health
      properties:
        id: *id001
        project_id: *id001
        protocol:
          type: string
          enum:
          - http
          - https
          - tcp
        listen_port:
          type: integer
        destination_port:
          type: integer
        proxy_protocol:
          type: string
          enum:
          - none
          - v1
          - v2
        timeout_s:
          type: integer
        certificates:
          type: array
          items: *id001
        sticky_sessions:
          type: boolean
        cookie_name:
          type: string
        cookie_lifetime_s:
          type: integer
        health_check: *id008
        health:
          $ref: '#/components/schemas/HealthSummary'
        domains:
          type: array
          items:
            type: string
          description: domains routed to this service
    TargetInput:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - ip
          - host
          - label_selector
        ip:
          type: string
          description: ip, optionally ip:port or [v6]:port
        host_id: *id001
        label_selector:
          type: string
        use_private_ip:
          type: boolean
        port:
          type: integer
          description: override the service destination port for this target
        weight:
          type: integer
        backup:
          type: boolean
    TargetsCreate:
      type: object
      required:
      - targets
      properties:
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetInput'
    TargetUpdate:
      type: object
      required: []
      properties:
        weight:
          type: integer
        backup:
          type: boolean
        admin_state:
          type: string
          enum:
          - ready
          - drain
          - maint
    TargetCheck:
      type: object
      required:
      - service_id
      - status
      properties:
        service_id: *id001
        status:
          type: string
          enum:
          - healthy
          - unhealthy
          - unknown
        check:
          type: string
        sessions:
          type: number
    ResolvedTarget:
      type: object
      required:
      - slot_id
      - address
      - status
      - checks
      properties:
        slot_id: *id001
        host_id: *id005
        name: *id009
        address:
          type: string
        status:
          type: string
          enum:
          - healthy
          - unhealthy
          - degraded
          - unknown
        checks:
          type: array
          items:
            $ref: '#/components/schemas/TargetCheck'
    Target:
      type: object
      required:
      - id
      - project_id
      - type
      - use_private_ip
      - weight
      - backup
      - admin_state
      - removing
      - resolved
      properties:
        id: *id001
        project_id: *id001
        type:
          type: string
          enum:
          - ip
          - host
          - label_selector
        ip: *id009
        host_id: *id005
        label_selector: *id009
        port:
          type: integer
          nullable: true
        use_private_ip:
          type: boolean
        weight:
          type: integer
        backup:
          type: boolean
        admin_state:
          type: string
          enum:
          - ready
          - drain
          - maint
        removing:
          type: boolean
        resolved:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedTarget'
