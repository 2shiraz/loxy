name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  HAPROXY_VERSION: 3.4.6
  IMAGE: ghcr.io/2shiraz/loxy

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            HAPROXY_VERSION=${{ env.HAPROXY_VERSION }}
            LOXY_VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-haproxy${{ env.HAPROXY_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: create GitHub release after publishing images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
