name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HAPROXY_VERSION: 3.4.6

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout 5m
      - name: gofmt + go vet
        run: make lint GOLANGCI=
      - name: unit tests
        run: make test
      - name: build
        run: make build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install, check, build
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - name: bundle-size check
        run: |
          if [ -f web/scripts/bundle-size.mjs ]; then
            node web/scripts/bundle-size.mjs
          else
            echo "web/scripts/bundle-size.mjs not present; skipping"
          fi

  integration:
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pull pinned HAProxy image
        run: docker pull haproxy:${HAPROXY_VERSION}-alpine
      - name: integration tests
        run: make test-integration

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          build-args: |
            HAPROXY_VERSION=${{ env.HAPROXY_VERSION }}
            LOXY_VERSION=${{ github.sha }}
          tags: ghcr.io/2shiraz/loxy:ci-haproxy${{ env.HAPROXY_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
