# Development stack (INSTRUCTIONS.md §17): `make dev`.
# All services use host networking; state lives in .dev/ at the repo root.
#   panel (via HAProxy sys_panel): https://127.0.0.1:8443   internal API: http://127.0.0.1:9090
#   whoami targets: 127.0.0.1:9001-9003 (POST /health with body 500 to make one unhealthy)
#   pebble ACME: https://127.0.0.1:14000/dir (mgmt 15000), challtestsrv DNS 127.0.0.1:8053
name: loxy-dev
services:
  loxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        HAPROXY_VERSION: 3.4.6
        LOXY_VERSION: dev
    network_mode: host
    restart: unless-stopped
    environment:
      LOXY_DEV: "true"
      LOXY_LOG_LEVEL: debug
      # Fixed, insecure dev key (32 zero bytes). Never use outside development.
      LOXY_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LOXY_LISTEN: 127.0.0.1:9090
      LOXY_ACME_EMAIL: dev@example.test
      LOXY_ACME_DIRECTORY: https://127.0.0.1:14000/dir
      LOXY_ACME_INSECURE: "true"
    volumes:
      - ../../.dev/haproxy-conf:/usr/local/etc/haproxy
      - ../../.dev/haproxy-state:/var/lib/haproxy
      - ../../.dev/run/haproxy:/run/haproxy
      - ../../.dev/loxy:/var/lib/loxy
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
    depends_on:
      pebble: { condition: service_started }

  haproxy:
    image: haproxy:3.4.6-alpine
    network_mode: host
    restart: unless-stopped
    user: "0:0"
    group_add: ["1500"]
    entrypoint: ["haproxy", "-W", "-db",
                 "-S", "/run/haproxy/master.sock,mode,660,gid,1500",
                 "-f", "/usr/local/etc/haproxy/live/haproxy.cfg"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, KILL, CHOWN]
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    volumes:
      - ../../.dev/haproxy-conf:/usr/local/etc/haproxy:ro
      - ../../.dev/haproxy-state:/var/lib/haproxy
      - ../../.dev/run/haproxy:/run/haproxy
    depends_on:
      loxy: { condition: service_healthy }

  whoami1:
    image: traefik/whoami:latest
    network_mode: host
    command: ["--port", "9001", "--name", "whoami1"]
  whoami2:
    image: traefik/whoami:latest
    network_mode: host
    command: ["--port", "9002", "--name", "whoami2"]
  whoami3:
    image: traefik/whoami:latest
    network_mode: host
    command: ["--port", "9003", "--name", "whoami3"]

  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    network_mode: host
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "127.0.0.1:8053"]
    depends_on: [pebble-challtestsrv]

  pebble-challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    network_mode: host
    command: ["-defaultIPv4", "127.0.0.1", "-http01", "", "-https01", "", "-tlsalpn01", ""]
